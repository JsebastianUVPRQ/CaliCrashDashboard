[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cali-crash-dashboard"
version = "0.1.0"
description = "Interactive dashboard for modeling traffic accident frequency in Cali, Colombia"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JsebastianDS" }]
keywords = ["streamlit", "traffic", "safety", "cali", "dashboard", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas==2.3.3",
    "streamlit==1.57.0",
    "folium==0.20.0",
    "streamlit-folium==0.26.2",
    "plotly==6.7.0",
    "statsmodels==0.14.5",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.11.13",
    "mypy==1.15.0",
    "black==26.3.1",
    "pre-commit==4.2.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
exclude = ["venv/", "data/", "notebooks/"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit_folium", "folium", "plotly.*", "statsmodels.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]